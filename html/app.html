<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Treasure Hunts</title>

	<meta name="description" content="Start a new Treasure Hunt game.
	Choose a game mode, enter your team name and begin solving puzzles to climb the leaderboard.">
	<meta name="keywords" content="start treasure hunt game, puzzle game start, online quiz game, treasure hunt teams">
	<meta name="author" content="Team C, 3RussiansAndMe">
	<meta name="robots" content="index, follow">
	<link rel="icon" type="image/png" href="/media/photo/pirate-hat.png">
	<link rel="stylesheet" href="../css/app.css">
</head>
<body>

<div class="loader"></div>


<!-- The Modal -->
<div id="myModal" class="modal">
    <!-- Modal content -->
    <div class="modal-content">
        <span class="closeModal">&times;</span>
        <p></p>
    </div>
</div>

<header class="site-header">
		<div class="container header-container">
			<div class="logo-block">
				<img src="/media/photo/pirate-hat.png" alt="Treasure Hunt logo" class="logo-img">
			</div>

			<div class="title-block">
				<h1 id="title-index">Treasure Hunt Game</h1>
				<p class="team-name">By Team C</p>
			</div>
			<div class="search-header">
    			<button id="search-toggle" class="search-btn">🔍</button>
    			<div class="search-input-wrapper">
        			<input id="search-input" class="search-input" type="text" placeholder="Search...">
        			<button id="search-clear" class="search-clear">✕</button>
    			</div>
			</div>
			<!-- Resume Session Button-->
			<button id="resumeSession">Resume Game &#127918</button>
		</div>
	</header>

	<main class="main-content">
		<section class="app-section">
		<a href="index.html" class="prev-btn previous round">Back to Home</a>
		<h2>Start Your Adventure</h2>

		<div class="checkbox-block">
			<label>
				<input type="checkbox" id="include-finished">
				Include finished
			</label>
		</div>

		<div id="hunts-container"></div>

		<div class="pagination">
			<button id="previousPage">Previous</button>
			<button id="nextPage">Next</button>
		</div>

		<p id="error-message"></p>
		</section>
	</main>

	<script type="module" src="../js/app.js"></script>
	
    <script type="module" src="../js/resumeSession.js"></script>
<script src="../js/loader.js"></script>

	
</body>
</html>
