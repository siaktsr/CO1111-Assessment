<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Treasure Hunts</title>

	<meta name="description" content="Start a new Treasure Hunt game.
	Choose a game mode, enter your team name and begin solving puzzles to climb the leaderboard.">
	<meta name="keywords" content="start treasure hunt game, puzzle game start, online quiz game, treasure hunt teams">
	<meta name="author" content="Team C, 3RussiansAndMe">
	<meta name="robots" content="index, follow">
	<link rel="icon" type="image/png" href="/media/photo/pirate-hat.png">
	<link rel="stylesheet" href="../css/app.css">
</head>
<body>
    <header class="site-header">
		<div class="container header-container">
			<div class="logo-block">
				<img src="/media/photo/pirate-hat.png" alt="Treasure Hunt logo" class="logo-img">
			</div>

			<div class="title-block">
				<h1 id="title-index">Treasure Hunt Game</h1>
				<p class="team-name">By Team C</p>
			</div>
		</div>
	</header>

	<main class="main-content">
		<section class="app-section">
			<a href="index.html" class="prev-btn previous round">&#8249;</a>

			<h2>Start Your Adventure</h2>

			<div class="form-block">
				<label for="game-select"><b>Select game</b></label>
				<select id="game-select" disabled>
					<option value="">Loading games...</option>
				</select>
			</div>
			<div class="form-block">
				<label for="team-name"><b>Team name</b></label>
				<input
					type="text"
					id="team-name"
					placeholder="Enter team name"
					disabled>
			</div>

			<button id="start-game-btn" disabled>
				Start game
			</button>

			<p id="error-message"></p>

		</section>
	</main>

	<script type="module" src="../js/app.js"></script>

</body>
</html>
